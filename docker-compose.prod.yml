version: '3.8'

x-prod-common: &prod-common
  restart: always
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  migrations:
    <<: *prod-common
    profiles:
      - tools
    restart: no

  fastapi_server:
    <<: *prod-common
    ports:
      - "127.0.0.1:8000:8000"  
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --forwarded-allow-ips='*'
    deploy:
      resources:
        limits: { cpus: '2', memory: 2G }

  celery_worker:
    <<: *prod-common
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4
    deploy:
      resources:
        limits: { cpus: '2', memory: 2G }

  flower:
    <<: *prod-common
    ports:
      - "127.0.0.1:5555:5555"
    command: celery -A app.core.celery_app flower --port=5555 --basic_auth=${FLOWER_USER}:${FLOWER_PASSWORD}
    depends_on:
      celery_worker:
        condition: service_started  
    deploy:
      resources:
        limits: { memory: 512M }

  db:
    <<: *prod-common
    deploy:
      resources:
        limits: { memory: 4G }

  redis:
    <<: *prod-common
    command: redis-server --appendonly yes
    deploy:
      resources:
        limits: { memory: 1G }

  minio:
    <<: *prod-common
    deploy:
      resources:
        limits: { memory: 2G }
