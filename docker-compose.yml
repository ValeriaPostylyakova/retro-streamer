version: '3.8'

x-fastapi-common: &fastapi-common
  build: .
  env_file:
    - .env
  volumes:
    - .:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  migrations:
    build: .
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: alembic upgrade head
  fastapi_server:
    <<: *fastapi-common
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    <<: *fastapi-common
    command: watchfiles --filter python "celery -A app.core.celery_app worker --loglevel=info"

  # НОВЫЙ СЕРВИС: Flower для мониторинга Celery
  flower:
    <<: *fastapi-common
    ports:
      - "5555:5555"
    # Указываем тот же путь к приложению app.core.celery_app, что и у воркера
    command: celery -A app.core.celery_app flower --port=5555
    # Зависит от воркера, чтобы запускаться, когда всё готово
    depends_on:
      celery_worker:
        condition: service_started

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432" 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001" 
    environment:
      MINIO_ROOT_USER: ${S3_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  pg_data:
  redis_data:
  minio_data:
